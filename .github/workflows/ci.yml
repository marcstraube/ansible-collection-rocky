---
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# One CI run per pull request: a new commit cancels the run of the previous
# one. Pushes to main and develop get a group of their own per commit, so a
# merge run is never cancelled or queued behind another.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =============================================================================
  # LINT (always runs)
  # =============================================================================
  lint:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r .github/requirements-ci.txt

      - name: Install collection dependencies
        run: |
          ansible-galaxy collection install marcstraube.common
          ansible-galaxy collection install community.general community.crypto ansible.posix containers.podman

      - name: Run ansible-lint
        run: ansible-lint

  # =============================================================================
  # MARKDOWN LINT (always runs)
  # =============================================================================
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint.yml
          globs: '**/*.md'

  # =============================================================================
  # YAML LINT (always runs)
  # =============================================================================
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r .github/requirements-ci.txt

      - name: Run yamllint
        run: yamllint -c .yamllint .

  # =============================================================================
  # DETECT CHANGED ROLES
  # Determines which podman roles need molecule testing based on git diff.
  # Only substantive changes trigger tests (not README-only edits).
  # Shared file changes (galaxy.yml dependencies, requirements.yml, plugins/,
  # meta/runtime.yml and this workflow) test all roles.
  # Scenarios with other drivers (installer dhcp-auto) run locally.
  # On workflow_dispatch: full matrix (all roles × all platforms).
  # =============================================================================
  detect-changes:
    name: Detect Changed Roles
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_roles: ${{ steps.set-matrix.outputs.has_roles }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Determine roles and platforms to test
        id: set-matrix
        run: |
          # Auto-detect podman roles from molecule driver config
          ALL_PODMAN_ROLES=""
          for f in roles/*/molecule/default/molecule.yml; do
            if grep -q 'name: podman' "$f"; then
              role=$(echo "$f" | cut -d/ -f2)
              ALL_PODMAN_ROLES="$ALL_PODMAN_ROLES $role"
            fi
          done

          # On schedule or manual dispatch: test everything
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Event '$EVENT' — full matrix (all roles × all platforms)"
            ROLES="$ALL_PODMAN_ROLES"
          elif [ "${{ github.head_ref }}" = "release-please--branches--main" ]; then
            # The release PR carries the tree of main plus the version bump
            # and the changelog; every commit on main passed the matrix when
            # its PR merged, so there is nothing new to test here.
            echo "Release PR — skipping the molecule matrix"
            ROLES=""
          elif [ "${{ github.head_ref }}" = "develop" ] || [ "${{ github.head_ref }}" = "main" ]; then
            # Merges between the long-lived branches (the release merge of
            # develop into main, the back-merge of main into develop) only
            # carry commits whose PRs passed the matrix already.
            echo "Merge between main and develop — skipping the molecule matrix"
            ROLES=""
          else
            # Determine base commit for diff
            if [ "$EVENT" = "pull_request" ]; then
              BASE="${{ github.event.pull_request.base.sha }}"
            elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              BASE="${{ github.event.before }}"
            else
              echo "Initial or force push — testing all roles"
              BASE=""
            fi

            # If no valid base, test all podman roles
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
              ROLES="$ALL_PODMAN_ROLES"
            else
              CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")

              # galaxy.yml affects every role through its dependencies
              # only; changes to the version, description or tags affect
              # none and fall through to the per-role detection.
              GALAXY_DEPS=unchanged
              if echo "$CHANGED" | grep -qx 'galaxy\.yml'; then
                GALAXY_DEPS=$(python3 -c "
          import subprocess, sys, yaml
          def deps(rev):
              out = subprocess.run(['git', 'show', rev + ':galaxy.yml'],
                                   capture_output=True, text=True)
              if out.returncode != 0:
                  return None
              return (yaml.safe_load(out.stdout) or {}).get('dependencies')
          print('unchanged' if deps(sys.argv[1]) == deps(sys.argv[2]) else 'changed')
          " "$BASE" "${{ github.sha }}")
                echo "galaxy.yml dependencies: $GALAXY_DEPS"
              fi

              # Shared files that require testing all roles
              if [ "$GALAXY_DEPS" = "changed" ] \
                || echo "$CHANGED" | grep -qE '^(requirements\.yml|plugins/|meta/runtime\.yml|\.github/workflows/ci\.yml)'; then
                echo "Shared files changed — testing all roles"
                ROLES="$ALL_PODMAN_ROLES"
              else
                # Find roles with substantive changes (skip README-only)
                ROLES=$(echo "$CHANGED" \
                  | grep '^roles/' \
                  | grep -v '/README\.md$' \
                  | sed 's|^roles/\([^/]*\)/.*|\1|' \
                  | sort -u \
                  | tr '\n' ' ')

                # Filter to podman roles only
                FILTERED=""
                for role in $ROLES; do
                  if echo " $ALL_PODMAN_ROLES " | grep -q " $role "; then
                    FILTERED="$FILTERED $role"
                  fi
                done
                ROLES="$FILTERED"
              fi
            fi
          fi

          # Build JSON matrix: one entry per (role, scenario, platform).
          # All molecule scenarios (default plus extras like 'dhcp-auto') are
          # discovered; platforms come from each scenario's molecule.yml.
          # Only podman scenarios run here.
          MATRIX="["
          FIRST=true
          for role in $ROLES; do
            [ -z "$role" ] && continue
            for scenario_dir in roles/$role/molecule/*/; do
              scenario=$(basename "$scenario_dir")
              mol="${scenario_dir}molecule.yml"
              [ -f "$mol" ] || continue
              grep -q 'name: podman' "$mol" || continue
              platforms=$(python3 -c "
          import yaml, sys
          with open(sys.argv[1]) as f:
              data = yaml.safe_load(f)
          for p in data.get('platforms', []):
              print(p['name'])
          " "$mol")
              for platform in $platforms; do
                if [ "$FIRST" = "true" ]; then
                  FIRST=false
                else
                  MATRIX="${MATRIX},"
                fi
                MATRIX="${MATRIX}{\"role\":\"${role}\",\"scenario\":\"${scenario}\",\"platform\":\"${platform}\"}"
              done
            done
          done
          MATRIX="${MATRIX}]"

          if [ "$MATRIX" = "[]" ]; then
            echo "has_roles=false" >> "$GITHUB_OUTPUT"
            echo "No roles to test"
          else
            echo "has_roles=true" >> "$GITHUB_OUTPUT"
            echo "Roles to test: $ROLES"
            echo "Matrix entries: $(echo "$MATRIX" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          fi

          echo "matrix={\"include\":${MATRIX}}" >> "$GITHUB_OUTPUT"

  # =============================================================================
  # MOLECULE ROLE × SCENARIO × PLATFORM (changed roles × all their
  # podman scenarios and platforms; full matrix on workflow_dispatch)
  # =============================================================================
  molecule-roles:
    name: Molecule ${{ matrix.role }} / ${{ matrix.scenario }} (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    needs: [lint, markdown-lint, yaml-lint, detect-changes]
    if: needs.detect-changes.outputs.has_roles == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: .github/requirements-molecule.txt

      - name: Install dependencies
        run: pip install "ansible-core~=2.17.0" -r .github/requirements-molecule.txt

      - name: Install collection dependencies
        run: |
          ansible-galaxy collection install marcstraube.common
          ansible-galaxy collection install community.general community.crypto ansible.posix containers.podman

      - name: Pin crun to a spec-compatible release
        # The ubuntu-24.04 image ships crun versions that vary with the runner
        # image rollout; crun < 1.14.3 cannot parse the OCI runtime spec v1.2.1
        # config that podman 5.x writes, failing container create with
        # "crun: unknown version specified". Pin a known-good static build.
        run: |
          CRUN_VERSION=1.28
          sudo curl -fsSL -o /usr/bin/crun \
            "https://github.com/containers/crun/releases/download/${CRUN_VERSION}/crun-${CRUN_VERSION}-linux-amd64"
          sudo chmod +x /usr/bin/crun
          crun --version

      - name: Run Molecule test
        working-directory: roles/${{ matrix.role }}
        run: molecule test -s ${{ matrix.scenario }}
        env:
          MOLECULE_PLATFORM_NAME: ${{ matrix.platform }}
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'

  # =============================================================================
  # BUILD (always runs)
  # =============================================================================
  build:
    name: Build Collection
    runs-on: ubuntu-24.04
    needs: [lint, markdown-lint, yaml-lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r .github/requirements-ci.txt

      - name: Build collection
        run: ansible-galaxy collection build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: collection-tarball
          path: '*.tar.gz'
          retention-days: 30

  # =============================================================================
  # CI GATE (single required check for branch protection)
  # =============================================================================
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    if: always()
    needs: [lint, markdown-lint, yaml-lint, build, molecule-roles]
    steps:
      - name: Check required job results
        run: |
          results=(
            "${{ needs.lint.result }}"
            "${{ needs.markdown-lint.result }}"
            "${{ needs.yaml-lint.result }}"
            "${{ needs.build.result }}"
            "${{ needs.molecule-roles.result }}"
          )
          for r in "${results[@]}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Required job failed or was cancelled: $r"
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped"
