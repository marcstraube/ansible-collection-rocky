# Release notes, generated by GitHub for release-please (changelog-type:
# github): one entry per pull request, grouped by its label. Pull requests
# that change only CI, tooling or dependencies are left out, as are the
# release and back-merge pull requests.
changelog:
  exclude:
    labels:
      - ci
      - chore
      - github_actions
      - dependencies
      - 'autorelease: pending'
      - 'autorelease: tagged'
  categories:
    - title: ⚠ Breaking Changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
        - security
    - title: Code Refactoring
      labels:
        - refactor
    - title: Documentation
      labels:
        - documentation
    - title: Other Changes
      labels:
        - '*'
